name: Build and Release Standalone Binary

on:
  release:
    types: [published] # Triggert den Workflow, sobald ein Release veröffentlicht wird

permissions:
  contents: write # Erlaubt der Action, die Datei an das Release anzuhängen

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            output: lynx-linux-x64
          - target: bun-darwin-arm64
            output: lynx-macos-arm64
          - target: bun-darwin-x64
            output: lynx-macos-x64
          - target: bun-windows-x64
            output: lynx-windows-x64.exe
          

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # Installiert die aktuelle Bun-Version

      - name: Install dependencies
        run: bun install

      - name: Build Standalone Binary
        run: |
          echo "[*] Building standalone ..."
          bun build ./lyn-x.js --compile --minify --target=${{ matrix.target }} --outfile ${{ matrix.output }}

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.output }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
