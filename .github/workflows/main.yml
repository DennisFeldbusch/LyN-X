name: Build and Release Standalone Binary

on:
  release:
    types: [published] # Triggert den Workflow, sobald ein Release veröffentlicht wird

permissions:
  contents: write # Erlaubt der Action, die Datei an das Release anzuhängen

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # Installiert die aktuelle Bun-Version

      - name: Install dependencies
        run: bun install

      - name: Build Standalone Binary
        run: |
          echo "[*] Building standalone ./lynx (linux-x64) ..."
          bun build ./lyn-x.js --compile --minify --target=bun-linux-x64 --outfile lynx
          chmod +x lynx

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lynx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
